version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      dev-deps:
        patterns:
          - "pytest*"
          - "ruff"
          - "mypy"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
